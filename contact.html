bel for="date">3. 見学希望日時もしくは連絡希望日時</label><input id="date" name="date" placeholder="例：12月9日（水）14時頃" maxlength="200"><p class="help">ご希望があればご記入ください。時間はご相談に応じます。</p></div><div class="field"><label for="message">4. その他お問い合わせ</label><textarea id="message" name="message" placeholder="お問い合わせ内容をご記入ください。" maxlength="3000"></textarea></div><button class="btn" type="submit">メールで問い合わせる →</button><p class="help">入力内容が入ったメール作成画面が開きます。内容をご確認のうえ、メールアプリから送信してください。</p><p id="status" role="status" class="help" hidden></p></form><div class="direct">直接メールでのお問い合わせ<br><a href="mailto:tatikumu96@gmail.com">tatikumu96@gmail.com</a></div></main><footer>渡嘉敷守良流　東京・沖縄芸能保存会　鎌倉支部</footer><script>
